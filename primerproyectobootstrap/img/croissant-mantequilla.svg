<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
  <feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.2  0 0 0 0.5 0"/>
</filter>
<filter id="porous" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.22" numOctaves="3" seed="4" result="n"/>
  <feColorMatrix in="n" values="0 0 0 0 0.35  0 0 0 0 0.18  0 0 0 0 0.05  0 0 0 -1.6 1.05" result="spots"/>
  <feComposite in="spots" in2="SourceGraphic" operator="in" result="tex"/>
  <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tex"/></feMerge>
</filter>
<filter id="porous2" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.35" numOctaves="2" seed="6" result="n"/>
  <feColorMatrix in="n" values="0 0 0 0 0.45  0 0 0 0 0.24  0 0 0 0 0.08  0 0 0 -1.4 0.82" result="spots"/>
  <feComposite in="spots" in2="SourceGraphic" operator="in" result="tex"/>
  <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tex"/></feMerge>
</filter>
<filter id="fine" x="0" y="0" width="100%" height="100%">
