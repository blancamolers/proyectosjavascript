  <feColorMatrix in="n" values="0 0 0 0 0.6  0 0 0 0 0.75  0 0 0 0 0.9  0 0 0 -2 1.25" result="spots"/>
  <feComposite in="spots" in2="SourceGraphic" operator="in" result="tex"/>
  <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tex"/></feMerge>
</filter>
<filter id="wood" x="0" y="0" width="100%" height="100%">
