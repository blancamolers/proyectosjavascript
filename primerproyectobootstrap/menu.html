<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menú · Dalbit Café</title>

  <!-- Fuentes de Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">

  <!-- Bootstrap (archivo local) y mis estilos -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100" data-pagina="menu">

  <!-- Aquí plantilla.js pone el menú de arriba -->
  <div id="cabecera" class="sticky-top"></div>

  <!-- ========== MENÚ ========== -->
  <main class="flex-grow-1 py-5">
    <div class="container">
      <div class="text-center mb-5">
        <h1 class="display-6">Nuestro menú</h1>
        <p class="text-body-secondary">Todo se prepara al momento, con mucho cariño.</p>
      </div>

      <!-- Buscador y botones de filtro -->
      <div class="row justify-content-center mb-4">
        <div class="col-12 col-md-6">
          <input type="search" id="buscador" class="form-control form-control-lg rounded-pill" placeholder="🔍 Buscar en el menú...">
        </div>
      </div>
      <div class="text-center mb-5">
        <button class="btn btn-outline-primary rounded-pill px-4 m-1 btn-filtro active" data-filtro="todos">Todos</button>
        <button class="btn btn-outline-primary rounded-pill px-4 m-1 btn-filtro" data-filtro="bebidas">☕ Bebidas</button>
        <button class="btn btn-outline-primary rounded-pill px-4 m-1 btn-filtro" data-filtro="postres">🍰 Postres</button>
        <button class="btn btn-outline-primary rounded-pill px-4 m-1 btn-filtro" data-filtro="croissants">🥐 Croissants</button>
      </div>

      <!-- Mensaje si la búsqueda no encuentra nada -->
      <p id="sinResultados" class="text-center text-body-secondary d-none">No encontramos nada con ese nombre 🥲</p>

      <!-- Las tarjetas las crea js/menu.js con la lista "productos" -->
      <div class="grupo mb-5" data-categoria="bebidas">
        <h3 class="mb-4">☕ Bebidas</h3>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4"></div>
      </div>

      <div class="grupo mb-5" data-categoria="postres">
        <h3 class="mb-4">🍰 Postres</h3>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4"></div>
      </div>

      <div class="grupo mb-5" data-categoria="croissants">
        <h3 class="mb-4">🥐 Croissants</h3>
        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4"></div>
      </div>
    </div>
  </main>

  <!-- Aquí plantilla.js pone el pie, el carrito y las ventanas -->
  <div id="piezasComunes"></div>

  <!-- JavaScript: Bootstrap, piezas comunes, código común y el de esta página -->
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/plantilla.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
